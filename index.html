<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo ICT - Semana de Escuela 🏗️</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle at top, #1a365d 0%, #0f172a 40%, #1c1917 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
        /* ── Cinta de precaución superior ── */
        .garland-banner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 38px;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 20;
            overflow: hidden;
        }
        .bunting {
            width: 32px;
            height: 30px;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            animation: swayBunting 2.5s ease-in-out infinite alternate;
            transform-origin: top center;
        }
        .b-orange { background: #ea580c; animation-delay: 0.1s; }
        .b-yellow { background: #facc15; animation-delay: 0.3s; }
        .b-grey   { background: #57534e; animation-delay: 0.5s; }
        @keyframes swayBunting {
            0% { transform: rotate(-8deg); }
            100% { transform: rotate(8deg); }
        }

            max-width: 1040px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 30px;
